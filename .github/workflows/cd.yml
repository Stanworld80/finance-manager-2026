name: Deployment (Staging)

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.ai-context.md'
      - '.github/**'

jobs:
  deploy_staging:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build and Deploy (All Platforms Staging)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          .\build_deploy.ps1 -Environment dev -Platform all -BypassTest -NoGit
