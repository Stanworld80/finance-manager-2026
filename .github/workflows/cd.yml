name: Deployment (Staging)

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
      - '.ai-context.md'
      - '.github/**'

jobs:
  unit_tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Unit Tests
        run: flutter test test/unit/

  security_tests:
    name: Run Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Security Tests
        run: flutter test test/security/

  integration_tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Integration Tests
        run: flutter test test/mcp_server_test.dart

  e2e_tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Firebase Emulators (Docker Compose)
        run: docker compose up -d

      - name: Run E2E Smoke Tests
        run: xvfb-run flutter drive --driver=test_driver/integration_test.dart --target=integration_test/features/auth_flow_test.dart -d chrome

  deploy_staging:
    name: Build & Deploy (Staging)
    needs: [unit_tests, security_tests, integration_tests, e2e_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build and Deploy (All Platforms Staging)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          pwsh ./build_deploy.ps1 -Environment staging -Platform all -BypassTest -NoGit
