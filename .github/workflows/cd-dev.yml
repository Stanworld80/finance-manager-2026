name: Deployment (Dev)

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.ai-context.md'
      - '.github/**'

jobs:
  # 1. Flutter Unit & Widget Tests
  unit_widget_tests:
    name: Flutter Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Unit & Widget Tests
        run: flutter test test/unit/

  # 2. MCP Server Test & Firestore Security Rules
  mcp_security_tests:
    name: MCP & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run MCP Server Test
        run: flutter test test/mcp_server_test.dart

      - name: Run Security Rules Tests
        run: flutter test test/security/

  # 3. Build Android (Dev)
  build_android:
    name: Build Android (Dev)
    needs: [unit_widget_tests, mcp_security_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (Dev)
        run: |
          pwsh ./build_deploy.ps1 -Environment develop -Platform android -NoDeploy -BypassTest -NoGit

  # 4. Build & Deploy Web (Dev)
  build_deploy_web:
    name: Build & Deploy Web (Dev)
    needs: [unit_widget_tests, mcp_security_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build & Deploy Web (Dev)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          pwsh ./build_deploy.ps1 -Environment develop -Platform web -BypassTest -NoGit

  # 5. Web E2E Integration Tests (Smoke)
  web_e2e_tests:
    name: Web E2E Integration Tests
    needs: [build_deploy_web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Start Firebase Emulators
        run: |
          firebase emulators:start --only firestore,auth &
          sleep 10

      - name: Start Xvfb (Virtual Display)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Start ChromeDriver
        run: |
          chromedriver --port=4444 &
          sleep 5

      - name: Run Web E2E Smoke Test
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/patrol_flow_test.dart \
            -d chrome \
            --release \
            --dart-define=USE_EMULATORS=true

  # 6. Post-Deploy Smoke Test
  post_deploy_smoke_test:
    name: Post-Deploy Smoke Test
    needs: [build_deploy_web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Health Check Dev URL
        run: |
          curl -I -sS -f https://finance-manager-2026-dev.web.app
